<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>הספרייה של הסרטים</title>
    <style>
        :root { 
            --primary: #6366f1; 
            --bg: #f8fafc; 
            --text: #1e293b; 
            --chat-bg: white;
            --bot-bg: #f1f5f9;
            --input-border: #e2e8f0;
        }

        /* הגדרות מצב לילה (Dark Mode) */
        body.dark-mode {
            --bg: #0f172a;
            --text: #f8fafc;
            --chat-bg: #1e293b;
            --bot-bg: #334155;
            --input-border: #475569;
        }

        body { background: var(--bg); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; transition: background 0.4s ease, color 0.4s ease; color: var(--text); }
        #app { width: 420px; height: 680px; background: var(--chat-bg); border-radius: 25px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--input-border); transition: background 0.4s ease, border-color 0.4s ease; position: relative; }
        header { background: var(--primary); color: white; padding: 15px 20px; text-align: center; font-weight: bold; font-size: 1.3rem; letter-spacing: 0.5px; display: flex; justify-content: space-between; align-items: center; }
        header button.upgrade-btn { background: #f59e0b; color: white; border: none; padding: 5px 12px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
        header button.upgrade-btn:hover { background: #d97706; }
        
        #chat { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .msg { padding: 12px 18px; border-radius: 18px; max-width: 85%; line-height: 1.5; font-size: 0.95rem; box-sizing: border-box; animation: fadeIn 0.3s ease-in-out; }
        .user { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 4px; }
        .bot { align-self: flex-start; background: var(--bot-bg); color: var(--text); border-bottom-left-radius: 4px; transition: background 0.4s ease, color 0.4s ease; }
        
        /* עיצוב פרסומת בתוך הצ'אט */
        .ad-box { align-self: center; background: linear-gradient(135deg, #fef08a, #fed7aa); border: 2px dashed #f97316; border-radius: 15px; padding: 15px; text-align: center; max-width: 90%; color: #7c2d12; box-shadow: 0 4px 6px rgba(0,0,0,0.05); animation: fadeIn 0.3s ease-in-out; }
        .ad-box img { max-width: 100%; border-radius: 10px; margin-top: 10px; }
        
        /* עיצוב מודעת בוט פנימית צבעונית ומעוצבת */
        .promo-banner { align-self: center; background: linear-gradient(135deg, #8b5cf6, #ec4899); color: white; border-radius: 15px; padding: 15px; text-align: center; width: 100%; box-sizing: border-box; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3); font-weight: bold; animation: fadeIn 0.3s ease-in-out; }
        
        /* חלון פרסומת קופץ עם טיימר מתוקן לחלוטין למניעת תקיעות */
        #adModal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; animation: fadeIn 0.3s ease; }
        .ad-popup-content { background: var(--chat-bg); padding: 25px; border-radius: 20px; text-align: center; max-width: 85%; box-shadow: 0 10px 25px rgba(0,0,0,0.3); position: relative; color: var(--text); }
        .close-ad-btn { position: absolute; top: 10px; left: 10px; background: #ef4444; color: white; border: none; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 1001; }
        .close-ad-btn:disabled { background: #94a3b8; cursor: not-allowed; opacity: 0.7; }

        a { color: var(--primary); font-weight: bold; text-decoration: none; transition: opacity 0.2s; }
        a:hover { opacity: 0.8; text-decoration: underline; }
        .input-area { padding: 15px; border-top: 1px solid var(--input-border); display: flex; gap: 8px; background: var(--chat-bg); transition: background 0.4s ease, border-color 0.4s ease; }
        input { flex: 1; border: 1px solid var(--input-border); background: var(--bg); color: var(--text); padding: 12px 15px; border-radius: 12px; outline: none; font-size: 1rem; font-family: inherit; transition: all 0.3s ease; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
        button.send-btn { background: var(--primary); color: white; border: none; padding: 0 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s; font-weight: bold; font-size: 1rem; }
        button.send-btn:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #loginScreen { width: 420px; height: 680px; background: var(--chat-bg); border-radius: 25px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; border: 1px solid var(--input-border); padding: 30px; box-sizing: border-box; transition: background 0.4s ease, border-color 0.4s ease; }
        #loginScreen h2 { margin: 0 0 10px 0; color: var(--text); text-align: center; }
        #loginScreen .login-emoji { font-size: 3rem; margin-bottom: 5px; }
        #loginScreen input { width: 100%; border: 1px solid var(--input-border); background: var(--bg); color: var(--text); padding: 12px 15px; border-radius: 12px; outline: none; font-size: 1rem; font-family: inherit; box-sizing: border-box; }
        #loginScreen button { width: 100%; background: var(--primary); color: white; border: none; padding: 12px 0; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        #loginError { color: #ef4444; font-size: 0.9rem; min-height: 20px; text-align: center; margin: 0; }
        #loginScreen .login-hint { color: var(--text); opacity: 0.6; font-size: 0.8rem; text-align: center; margin-top: -6px; }

        .loading-dots span {
            animation: blink 1.4s infinite both;
            font-weight: bold;
            display: inline-block;
            font-size: 1.4rem;
            line-height: 1;
            margin: 0 1px;
        }
        .loading-dots span:nth-child(2) { animation-delay: .2s; }
        .loading-dots span:nth-child(3) { animation-delay: .4s; }
        @keyframes blink {
            0% { opacity: .2; }
            20% { opacity: 1; }
            100% { opacity: .2; }
        }
    </style>
</head>
<body>

<!-- מסך התחברות -->
<div id="loginScreen">
    <div class="login-emoji">🎬</div>
    <h2>כניסה לספריית הסרטים</h2>
    <input type="text" id="loginUser" placeholder="שם משתמש" autocomplete="off" onkeypress="if(event.key==='Enter') document.getElementById('loginPass').focus()">
    <input type="password" id="loginPass" placeholder="סיסמה" autocomplete="off" onkeypress="if(event.key==='Enter') handleLogin()">
    <button onclick="handleLogin()">כניסה</button>
    <p id="loginError"></p>
    <p class="login-hint">הכנס פרטי משתמש להתחברות</p>
</div>

<!-- האפליקציה המרכזית -->
<div id="app" style="display:none;">
    <header>
        <span>הספרייה של הסרטים</span>
        <button id="headerUpgradeBtn" class="upgrade-btn" onclick="handleUpgradeClick()" style="display:none;">⭐ שדרוג</button>
    </header>
    
    <div id="chat"></div>
    
    <div class="input-area">
        <input type="text" id="userInput" placeholder="הקלד כאן..." onkeypress="if(event.key==='Enter') handleSend()">
        <button class="send-btn" onclick="handleSend()">שלח</button>
    </div>

    <!-- פופאפ פרסומת עם מנגנון טיימר מאובטח מחדש למניעת תקיעות -->
    <div id="adModal">
        <div class="ad-popup-content">
            <button class="close-ad-btn" id="closeAdBtn" disabled onclick="closeAdPopup()">✕</button>
            <h3 style="margin-top:0; color:#f97316;">✨ חסות מיוחדת ✨</h3>
            <p id="adTimerText" style="font-size: 0.9rem;">פרסומת זו תיסגר בעוד <span id="adTimerCount">3</span> שניות...</p>

        </div>
    </div>
</div>

    const adFreeUsers = ["אלחנן", "איתן"]; 

    let allFavorites = JSON.parse(safeStorage.getItem('movieFavorites') || '{}');
    let currentUser = safeStorage.getItem('currentUser') || null;
    let pendingAction = null; 
    let messageCounter = 0; 

    function handleLogin() {
        const userField = document.getElementById('loginUser').value.trim();
        const passField = document.getElementById('loginPass').value.trim();
        const errorEl = document.getElementById('loginError');

        if (!userField || !passField) {
            errorEl.textContent = "נא למלא שם משתמש וסיסמה.";
            return;
        }

        if (users.hasOwnProperty(userField) && users[userField] === passField) {
            currentUser = userField;
            saveUserData();
            errorEl.textContent = "";
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            
            if (adFreeUsers.includes(currentUser)) {
                document.getElementById('headerUpgradeBtn').style.display = 'none';
            } else {
                document.getElementById('headerUpgradeBtn').style.display = 'block';
            }

            showWelcomeMessage();
            document.getElementById('userInput').focus();
        } else {
            errorEl.textContent = "שם משתמש או סיסמה שגויים, נסה שוב.";
        }
    }

    function handleLogout() {
        document.getElementById('app').style.display = 'none';
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('loginUser').value = '';
        document.getElementById('loginPass').value = '';
        document.getElementById('loginError').textContent = '';
        document.getElementById('chat').innerHTML = '';
    }

    function showWelcomeMessage() {
        addBotMsg(`היי ${currentUser}! אני הבוט החכם לספריית הסרטים. 🎬 אני יודע לעשות המון דברים – מחיפוש סרטים ועד קסמים, מועדפים, חישובים ובדיחות. כתוב "עזרה" כדי לראות את כל הפונקציות המורחבות שלי!`);
    }

    function saveUserData() {
        safeStorage.setItem('movieFavorites', JSON.stringify(allFavorites));
        if (currentUser) safeStorage.setItem('currentUser', currentUser);
    }

    let lastResults = [];
    let justRandomized = false;

    function handleUpgradeClick() {
        let upgradeText = `✨ <b>רוצים חוויה מושלמת ללא פרסומות ויותר תוכן איכותי?</b> ✨<br><br>
        הספרייה שלנו גדלה כל הזמן ומציעה עולמות תוכן עשירים. אם תרצו ליהנות מגלישה חלקה לגמרי, בלי הפסקות, ובגישה לתכנים בלעדיים – <b>אפשר לפנות לאדמין</b> בקלות ונשמח לעזור לכם לשדרג את החשבון! 🚀`;
        addBotMsg(upgradeText, true);
    }

    // 📢 נתב פרסומות מתקדם
    // =========================================================================
    function triggerAdIfNeeded() {
        if (adFreeUsers.includes(currentUser)) return; 
        
        messageCounter++;
        
        if (messageCounter % 3 === 0) {
            showAdPopup(); 
        } else if (messageCounter % 5 === 0) {
            showInChatPromoBanner(); 
        }
    }

    let currentTimerInterval = null; 

    function showAdPopup() {
        const modal = document.getElementById('adModal');
        const btn = document.getElementById('closeAdBtn');
        const timerSpan = document.getElementById('adTimerCount');
        const timerText = document.getElementById('adTimerText');
        
        if (currentTimerInterval) {
            clearInterval(currentTimerInterval);
        }

        modal.style.display = 'flex';
        btn.disabled = true;
        let timeLeft = 3;
        
        // אתחול טקסט ומונה בצורה בטוחה בלי לדרוס את האלמנטים עצמם
        timerText.innerHTML = `פרסומת זו תיסגר בעוד <span id="adTimerCount">${timeLeft}</span> שניות...`;

        currentTimerInterval = setInterval(() => {
            timeLeft--;
            const span = document.getElementById('adTimerCount');
            if (span) span.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(currentTimerInterval);
                currentTimerInterval = null;
                btn.disabled = false;
                if (timerText) timerText.textContent = "ניתן לסגור את הפרסומת כעת ➔";
            }
        }, 1000);
    }

    function closeAdPopup() {
        if (currentTimerInterval) {
            clearInterval(currentTimerInterval);
            currentTimerInterval = null;
        }
        document.getElementById('adModal').style.display = 'none';
    }

    function showInChatPromoBanner() {
        const chat = document.getElementById('chat');
        const promoDiv = document.createElement('div');
        promoDiv.className = 'promo-banner';
        promoDiv.innerHTML = `🌟 <b>הבוט האולטימטיבי לסרטים וסדרות!</b> 🌟<br>מחפשים הנאה בטוחה לכל המשפחה? הגעתם למקום הנכון. שתפו חברים והמשיכו ליהנות מהמבחר העצום!`;
        chat.appendChild(promoDiv);
        chat.scrollTop = chat.scrollHeight;
    }

        if (title.includes("קוקו")) return { genre: "אנימציה, פנטזיה, מוזיקלי", summary: "מיגל הצעיר חולם להיות מוזיקאי ומוצא את עצמו במסע קסום, מוזיקלי וצבעוני בארץ המתים.", rec: "סרט מרגש בצורה יוצאת דופן שגורם גם למבוגרים להזיל דמעה." };
        
        return {
            genre: "אנימציה, הרפתקאות, קומדיה לכל המשפחה",
            summary: "סרט הרפתקאות סוחף, מהנה ומצחיק שמביא עמו חוויה קולנועית נהדרת.",
            rec: "סרט מומלץ ביותר שכיף גדול לראות לבד או ביחד!"
        };
    }

    function typeWriterHTML(element, htmlText, delay = 10) {
        let i = 0;
        element.innerHTML = "";
        function step() {
            if (i < htmlText.length) {
                if (htmlText[i] === '<') {
                    let closingBracket = htmlText.indexOf('>', i);
                    if (closingBracket !== -1) i = closingBracket + 1;
                    else i++;
                } else i++;
                
                element.innerHTML = htmlText.substring(0, i);
                const chat = document.getElementById('chat');
                chat.scrollTop = chat.scrollHeight;
                setTimeout(step, delay);
            }
        }
        step();
    }

    function addBotMsg(htmlText, instant = false) {
        const chat = document.getElementById('chat');
        const loaderDiv = document.createElement('div');
        loaderDiv.className = 'msg bot';
        
        if (instant) {
            loaderDiv.innerHTML = htmlText;
            chat.appendChild(loaderDiv);
            chat.scrollTop = chat.scrollHeight;
            triggerAdIfNeeded();
        } else {
            loaderDiv.classList.add('loading-dots');
            loaderDiv.innerHTML = '<span>.</span><span>.</span><span>.</span>';
            chat.appendChild(loaderDiv);
            chat.scrollTop = chat.scrollHeight;

            setTimeout(() => {
                loaderDiv.classList.remove('loading-dots');
                typeWriterHTML(loaderDiv, htmlText);
                triggerAdIfNeeded();
            }, 500);
        }
    }

    function addUserMsg(text) {
        const div = document.createElement('div');
        div.className = 'msg user';
        div.innerHTML = text;
        const chat = document.getElementById('chat');
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('app').style.display = 'none';
    });

    function addToFavoritesLogic(movieObj) {
        if (!currentUser) {
            pendingAction = { type: 'ask_name_for_fav', movie: movieObj };
            addBotMsg("בכיף! אבל לפני זה... איך קוראים לך? (כדי שאדע על מי לשמור את המועדפים)", false);
            return;
        }
        if (!allFavorites[currentUser]) allFavorites[currentUser] = [];
        if (!allFavorites[currentUser].includes(movieObj.title)) {
            allFavorites[currentUser].push(movieObj.title);
            saveUserData();
            addBotMsg(`הוספתי את <b>${movieObj.title}</b> למועדפים של ${currentUser}! 🌟`, false);
        } else {
            addBotMsg(`הסרט <b>${movieObj.title}</b> כבר נמצא במועדפים שלך, ${currentUser}.`, false);
        }
        lastResults = [];
    }

    function showFavoritesLogic() {
        let favs = allFavorites[currentUser] || [];
        if (favs.length === 0) {
            addBotMsg(`היי ${currentUser}, רשימת המועדפים שלך ריקה כרגע. אתה יכול להוסיף סרטים בקלות על ידי כתיבת פקודה כמו "תוסיף את סוניק למועדפים", ואני אשמור אותם עבורך בבטחה לחוויה מהירה ונוחה בכל פעם שתתחבר!`, false);
            return;
        }
        let matchedMovies = movies.filter(m => favs.includes(m.title));
        let msg = `<b>המועדפים המורחבים של ${currentUser} 🌟:</b><br>רשימת הסרטים המועדפים עליך נשמרת במערכת במיוחד עבורך. שלח את מספר הסרט כדי לקבל עליו פרטים מלאים, תקציר, ז'אנר וקישור ישיר לצפייה:<br><br>`;
        msg += matchedMovies.map((m, i) => `${i + 1}. ${m.title}`).join("<br>");
        addBotMsg(msg, true);
        lastResults = matchedMovies;
    }

    let switchUserTarget = "";

    function handleSend() {
        const input = document.getElementById('userInput');
        let val = input.value.trim();
        if (!val) return;
        
        addUserMsg(val);
        input.value = '';

        if (pendingAction) {
            if (pendingAction.type === 'ask_name_for_fav') {
                currentUser = val.trim();
                saveUserData();
                addToFavoritesLogic(pendingAction.movie);
                pendingAction = null;
                return;
            }
            if (pendingAction.type === 'ask_name_for_switch') {
                switchUserTarget = val.trim();
                if (!users.hasOwnProperty(switchUserTarget)) {
                    addBotMsg(`שם המשתמש "${switchUserTarget}" אינו קיים במערכת. נסה שוב או כתוב שם משתמש חוקי:`, false);
                    return;
                }
                pendingAction = { type: 'ask_pass_for_switch' };
                addBotMsg(`נמצא משתמש. אנא הקלד את ה<b>סיסמה</b> עבור ${switchUserTarget}:`, false);
                return;
            }
            if (pendingAction.type === 'ask_pass_for_switch') {
                let enteredPass = val.trim();
                if (users[switchUserTarget] === enteredPass) {
                    currentUser = switchUserTarget;
                    saveUserData();
                    if (adFreeUsers.includes(currentUser)) {
                        document.getElementById('headerUpgradeBtn').style.display = 'none';
                    } else {
                        document.getElementById('headerUpgradeBtn').style.display = 'block';
                    }
                    addBotMsg(`החלפת המשתמש בוצעה בהצלחה! עכשיו אנחנו מחוברים בתור <b>${currentUser}</b> 🍿`, false);
                } else {
                    addBotMsg(`סיסמה שגויה עבור ${switchUserTarget}. החלפת המשתמש בוטלה.`, false);
                }
                pendingAction = null;
                switchUserTarget = "";
                return;
            }
            if (pendingAction.type === 'ask_name_for_show') {
                currentUser = val.trim();
                saveUserData();
                pendingAction = null;
                showFavoritesLogic(); 
                return;
            }
        }

        if (val.includes("שדרוג") || val.includes("אפשר לשדרג") || val.includes("שרוג") || val.includes("לשדרג")) {
            handleUpgradeClick();
            return;
        }

        const choice = parseInt(val);
        if (lastResults.length > 0 && !isNaN(choice) && choice > 0 && choice <= lastResults.length) {
            const selected = lastResults[choice - 1];
            
            if (pendingAction && pendingAction.type === 'wait_movie_choice_for_fav') {
                pendingAction = null;
                addToFavoritesLogic(selected);
                return;

            const details = getMovieDetails(selected.title);

            lastResults = [];

            return;
        }

        const ignoreWords = ["אפשר", "תן", "בבקשה", "לי", "תביא", "את", "אני", "רוצה", "בא", "לראות", "סרט", "של"];
        let cleanVal = val;
        ignoreWords.forEach(word => {

        }

        if (cleanVal.includes("משחקים") || cleanVal.includes("משחק") || cleanVal.includes("הפעל משחק")) {
            let gamesMsg = `<b>🎮 מרכז המשחקים וההגרלות המלא:</b><br><br>
            במערכת שלנו ישנם מספר משחקים והפעלות מהנות שתוכל לשחק איתي בכל רגע שתחפוץ:<br><br>
            1. <b>הטלת מטבע ("עץ או פלי"):</b> נותן לי להטיל מטבע וירטואלי ולהגיד לך האם יצא עץ 🌳 או פלי 🪙.<br>
            2. <b>הטלת קוביה ("זרוק קוביה"):</b> מטיל קוביות משחק סטנדרטיות ומגריל עבורך מספר אקראי בין 1 ל-6 🎲.<br>
            3. <b>קלף רנדומלי ("קסם"):</b> מבצע בחירה חשאית של קלף רנדומלי מתוך חפיסת קלפים מלאה 🪄.<br>
            4. <b>מחשבון מהיר ("תחשב..."):</b> מבצע חישובים מתמטיים מדויקים מכל סוג ישירות בצ'אט 🧮.<br><br>
            <i>טיפ:</i> פשוט הקלד את שם המשחק או הפקודה שתרצה ואבצע זאת מיד!`;
            addBotMsg(gamesMsg, true);
            return;
        }

        if (cleanVal.includes("עזרה") || cleanVal.includes("פונקציות") || cleanVal.includes("יודע לעשות")) {
            let helpMsg = `<b>📖 מדריך העזרה המלא והמורחב של הבוט:</b><br><br>
            ברוך הבא למרכז העזרה! ניתן להרחיב כאן על כל פעולה שהבוט יודע לבצע:<br><br>
            🎬 <b>אזור סרטים וסדרות (מורחב):</b><br>
            • <b>חיפוש חופשי:</b> כתוב כל שם סרט או סדרה (כמו 'סוניק', 'קופה ראשית', 'מלך האריות') ואמצא אותו מיידית.<br>
            • <b>רשימה מלאה:</b> כתוב 'רשימה' כדי לראות את כל המבחר העצום.<br>
            • <b>הגרלת סרט:</b> כתוב 'תגריל' ואבחר עבורך סרט אקראי לצפייה.<br>
            • <b>המלצה לפי ז'אנר:</b> כתוב למשל 'סרטי קומדיה' או 'אנימציה' לקבלת רשימה ממוקדת.<br><br>
            🌟 <b>ניהול מועדפים (מורחב):</b><br>
            • תוכל לשמור סרטים לרשימה האישית שלך על ידי כתיבת "תוסיף [שם הסרט] למועדפים".<br>
            • כדי לצפות בכל מה ששמרת, הקלד "מועדפים". הרשימה תציג לך את כל הסרטים האישיים שלך יחד עם אפשרות לשלוח מספר ולקבל עליהם פרטים מלאים וקישור ישיר לצפייה!<br>
            • ניתן למחוק או לנקות את המועדפים בכל שלב.<br><br>
            🎮 <b>משחקים והפעלות (מורחב):</b><br>
            • כתוב "משחקים" כדי לקבל פירוט מלא על כל משחקי הקוביות, המטבעות, הקלפים והחישובים שהבוט מציע.<br><br>
            👤 <b>ניהול חשבון ואבטחה:</b><br>
            • <b>החלף משתמש:</b> מאפשר מעבר מאובטח לחשבון אחר באמצעות הקלדת שם משתמש וסיסמה.<br>
            • <b>התנתקות:</b> יציאה מלאה מהמערכת.<br><br>`;
            
            if (!adFreeUsers.includes(currentUser)) {
                helpMsg += `⭐ <b>שדרוג חשבון:</b><br>• כתוב 'אפשר לשדרג' או לחץ על כפתור השדרוג בראש המסך לקבלת חוויה נטולת פרסומות.<br><br>`;
            }

            helpMsg += `<i>💡 שימו לב: ניתן להרחבה נוספת בכל עת לפי בקשתך!</i>`;
            
            addBotMsg(helpMsg, true);
            return;
        }

        if (cleanVal.includes("תגריל") || cleanVal.includes("תבחר") || cleanVal.includes("הפתעה")) {
            const randomMovie = movies[Math.floor(Math.random() * movies.length)];
            const details = getMovieDetails(randomMovie.title);
            
            let response = `הגרלתי לך את הסרט: <b>${randomMovie.title}</b>.<br><br>`;
            response += `<b>🎭 ז'אנר:</b> ${details.genre}<br>`;
            response += `<b>📝 תקציר:</b> ${details.summary}<br>`;
            response += `<b>🍿 למה אני ממליץ:</b> ${details.rec}<br><br>`;
            response += `<a href='${randomMovie.url}' target='_blank'>לחץ כאן לצפייה</a>`;
            
            addBotMsg(response, false);
            justRandomized = true;
            lastResults = []; 
            return;
        }
        justRandomized = false; 

        if (cleanVal === "רשימה" || cleanVal === "סרטים" || cleanVal.includes("תביא רשימה")) {
            let msg = "הנה רשימת הסרטים המלאה! <b>שלח לי רק את המספר של הסרט שאתה רוצה לראות:</b><br><br>";
            msg += movies.map((m, i) => `${i + 1}. ${m.title}`).join("<br>");
            addBotMsg(msg, true);
            lastResults = movies; 
            return;
        }

        if (!cleanVal) {
            addBotMsg("אני מחכה... תגיד לי איזה סרט לחפש או תכתוב 'עזרה'.", false);
            return;
        }

        const searchWords = cleanVal.split(" ");
        const results = movies.filter(m => searchWords.every(word => m.title.includes(word)));

        if (results.length === 0) {
            addBotMsg("לא מצאתי סרט כזה... תנסה שם אחר, או תכתוב 'רשימה'.", false);
            lastResults = [];
        } else if (results.length === 1) {
            const details = getMovieDetails(results[0].title);
            let response = `מצאתי את הסרט: <b>${results[0].title}</b>.<br><br>`;
            response += `<b>🎭 ז'אנר:</b> ${details.genre}<br>`;
            response += `<b>📝 תקציר:</b> ${details.summary}<br>`;
            response += `<b>🍿 למה אני ממליץ:</b> ${details.rec}<br><br>`;
            response += `<a href='${results[0].url}' target='_blank'>לחץ כאן לצפייה</a>`;
            
            addBotMsg(response, false);
            lastResults = [];
        } else {
            let msg = `מצאתי ${results.length} תוצאות. <b>שלח את המספר של הסרט שאתה רוצה:</b><br><br>`;
            msg += results.map((m, i) => `${i + 1}. ${m.title}`).join("<br>");
            addBotMsg(msg, true);
            lastResults = results; 
        }
    }
</script>
